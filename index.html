<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Stack RPG Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        font-family: 'Press Start 2P', system-ui, sans-serif;
        image-rendering: pixelated;
      }

      .pixel-box {
        border: 4px solid #111827;
        box-shadow: 6px 6px 0 #111827;
      }

      .pixel-btn {
        border: 3px solid #111827;
        box-shadow: 4px 4px 0 #111827;
      }

      .pixel-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #111827;
      }

      /* Fallback utility styles when Tailwind CDN is unavailable */
      .min-h-screen { min-height: 100vh; }
      .max-w-6xl { max-width: 72rem; }
      .mx-auto { margin-left: auto; margin-right: auto; }
      .grid { display: grid; }
      .text-center { text-align: center; }
      .w-full { width: 100%; }
      .overflow-y-auto { overflow-y: auto; }
      .outline-none { outline: none; }
      .space-y-6 > * + * { margin-top: 1.5rem; }
      .space-y-4 > * + * { margin-top: 1rem; }
      .space-y-3 > * + * { margin-top: 0.75rem; }
      .space-y-2 > * + * { margin-top: 0.5rem; }
      .gap-3 { gap: 0.75rem; }
      .gap-6 { gap: 1.5rem; }
      .h-64 { height: 16rem; }
      .p-4 { padding: 1rem; }
      .p-3 { padding: 0.75rem; }
      .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .text-lg { font-size: 1.125rem; }
      .text-xs { font-size: 0.75rem; }
      .leading-relaxed { line-height: 1.625; }
      .border-4 { border-width: 4px; border-style: solid; }
      .border-slate-800 { border-color: #1e293b; }
      .bg-indigo-950 { background-color: #1e1b4b; }
      .bg-indigo-800 { background-color: #3730a3; }
      .bg-slate-950 { background-color: #020617; }
      .bg-slate-900 { background-color: #0f172a; }
      .bg-slate-100 { background-color: #f1f5f9; }
      .bg-emerald-400 { background-color: #34d399; }
      .bg-rose-400 { background-color: #fb7185; }
      .text-green-200 { color: #bbf7d0; }
      .text-yellow-300 { color: #fde047; }
      .text-cyan-300 { color: #67e8f9; }
      .text-cyan-200 { color: #a5f3fc; }
      .text-emerald-300 { color: #6ee7b7; }
      .text-rose-300 { color: #fda4af; }
      .text-slate-900 { color: #0f172a; }
      .text-slate-400 { color: #94a3b8; }
      .text-slate-300 { color: #cbd5e1; }
      .text-\[9px\] { font-size: 9px; }
      .text-\[10px\] { font-size: 10px; }

      @media (min-width: 768px) {
        .md\:p-6 { padding: 1.5rem; }
        .md\:text-2xl { font-size: 1.5rem; }
        .md\:text-sm { font-size: 0.875rem; }
        .md\:text-xs { font-size: 0.75rem; }
        .md\:text-\[10px\] { font-size: 10px; }
        .md\:grid-cols-\[1fr_auto_auto\] { grid-template-columns: 1fr auto auto; }
        .md\:items-center { align-items: center; }
      }

      @media (min-width: 1024px) {
        .lg\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body class="min-h-screen bg-indigo-950 text-green-200 p-4 md:p-6">
    <main class="max-w-6xl mx-auto space-y-6">
      <header class="pixel-box bg-indigo-800 p-4 md:p-6 text-center space-y-2">
        <h1 class="text-lg md:text-2xl text-yellow-300">TECH STACK RPG</h1>
        <p class="text-[10px] md:text-xs leading-relaxed">
          Enter your stack. Generate stats. Battle a random enemy stack.
        </p>
      </header>

      <section class="pixel-box bg-slate-900 p-4 md:p-6 space-y-4">
        <h2 class="text-xs md:text-sm text-cyan-300">YOUR TEAM SETUP</h2>
        <div class="grid gap-3 md:grid-cols-[1fr_auto_auto] md:items-center">
          <input
            id="stackInput"
            type="text"
            placeholder="e.g. React, TypeScript, Node.js"
            class="w-full px-3 py-3 bg-slate-100 text-slate-900 text-[10px] md:text-xs border-4 border-slate-800 outline-none"
          />
          <button
            id="addStackBtn"
            class="pixel-btn bg-emerald-400 text-slate-900 px-4 py-3 text-[10px] md:text-xs"
          >
            ADD
          </button>
          <button
            id="battleBtn"
            class="pixel-btn bg-rose-400 text-slate-900 px-4 py-3 text-[10px] md:text-xs"
          >
            BATTLE
          </button>
        </div>
        <p class="text-[9px] md:text-[10px] text-slate-300">
          Tip: comma-separated entries add multiple techs at once.
        </p>
      </section>

      <section class="grid gap-6 lg:grid-cols-2">
        <div class="pixel-box bg-slate-900 p-4 md:p-6 space-y-3">
          <h2 class="text-xs md:text-sm text-emerald-300">YOUR STACK</h2>
          <div id="playerStack" class="space-y-2 text-[9px] md:text-[10px]"></div>
        </div>
        <div class="pixel-box bg-slate-900 p-4 md:p-6 space-y-3">
          <h2 class="text-xs md:text-sm text-rose-300">ENEMY STACK</h2>
          <div id="enemyStack" class="space-y-2 text-[9px] md:text-[10px]"></div>
        </div>
      </section>

      <section class="pixel-box bg-slate-900 p-4 md:p-6 space-y-3">
        <h2 class="text-xs md:text-sm text-yellow-300">TURN LOG</h2>
        <div
          id="battleLog"
          class="h-64 overflow-y-auto bg-slate-950 border-4 border-slate-800 p-3 text-[9px] md:text-[10px] leading-relaxed space-y-2"
        ></div>
      </section>
    </main>

    <script>
      const stackInput = document.getElementById('stackInput');
      const addStackBtn = document.getElementById('addStackBtn');
      const battleBtn = document.getElementById('battleBtn');
      const playerStackEl = document.getElementById('playerStack');
      const enemyStackEl = document.getElementById('enemyStack');
      const battleLogEl = document.getElementById('battleLog');

      const enemyTechPool = [
        'React', 'Vue', 'Angular', 'Node.js', 'Django', 'FastAPI', 'PostgreSQL',
        'MongoDB', 'Redis', 'Kubernetes', 'Docker', 'AWS', 'TypeScript',
        'Go', 'Rust', 'GraphQL', 'Tailwind CSS', 'Svelte', 'Next.js', 'Flask'
      ];

      const keywordTraits = [
        { keys: ['rust', 'go', 'c++', 'kubernetes'], stat: 'atk', amount: 8 },
        { keys: ['typescript', 'java', 'postgres', 'graphql'], stat: 'def', amount: 8 },
        { keys: ['redis', 'svelte', 'vite', 'fastapi'], stat: 'spd', amount: 8 },
        { keys: ['aws', 'docker', 'node', 'django', 'react'], stat: 'hp', amount: 8 }
      ];

      const baseStats = { hp: 50, atk: 10, def: 8, spd: 8 };
      // Per-character stat scaling for tech-name-derived fighter stats.
      const HP_CHAR_MODIFIER = 6;
      const ATK_CHAR_MODIFIER = 4;
      const DEF_CHAR_MODIFIER = 3;
      const SPD_CHAR_MODIFIER = 5;
      // Combat tuning values for mitigation, damage floor, randomness, and timeout.
      const DEFENSE_MITIGATION = 0.45;
      const MIN_DAMAGE = 4;
      const DAMAGE_VARIANCE = 5;
      const MAX_TURNS = 500;
      let playerStack = [];

      function titleCase(str) {
        return str
          .split(' ')
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join(' ');
      }

      function getStatsForTech(rawName) {
        const name = rawName.trim();
        const lower = name.toLowerCase();
        const stats = { ...baseStats };

        for (const char of lower) {
          if (!/[a-z0-9]/.test(char)) continue;
          const code = char.charCodeAt(0);
          stats.hp += code % HP_CHAR_MODIFIER;
          stats.atk += code % ATK_CHAR_MODIFIER;
          stats.def += code % DEF_CHAR_MODIFIER;
          stats.spd += code % SPD_CHAR_MODIFIER;
        }

        keywordTraits.forEach((trait) => {
          if (trait.keys.some((key) => lower.includes(key))) {
            stats[trait.stat] += trait.amount;
          }
        });

        return {
          name: titleCase(name),
          maxHp: stats.hp,
          hp: stats.hp,
          atk: stats.atk,
          def: stats.def,
          spd: stats.spd
        };
      }

      function renderFighterCard(fighter) {
        const card = document.createElement('div');
        card.className = 'border-4 border-slate-800 bg-slate-950 p-2';

        const name = document.createElement('p');
        name.className = 'text-cyan-200';
        name.textContent = fighter.name;

        const stats = document.createElement('p');
        stats.textContent = `HP ${fighter.hp}/${fighter.maxHp} | ATK ${fighter.atk} | DEF ${fighter.def} | SPD ${fighter.spd}`;

        card.appendChild(name);
        card.appendChild(stats);
        return card;
      }

      function renderStacks(enemyStack = []) {
        playerStackEl.innerHTML = '';
        if (playerStack.length) {
          playerStack.forEach((fighter) => playerStackEl.appendChild(renderFighterCard(fighter)));
        } else {
          playerStackEl.innerHTML = '<p class="text-slate-400">No tech selected yet.</p>';
        }

        enemyStackEl.innerHTML = '';
        if (enemyStack.length) {
          enemyStack.forEach((fighter) => enemyStackEl.appendChild(renderFighterCard(fighter)));
        } else {
          enemyStackEl.innerHTML = '<p class="text-slate-400">Enemy appears when battle starts.</p>';
        }
      }

      function appendLog(line) {
        const row = document.createElement('p');
        row.textContent = line;
        battleLogEl.appendChild(row);
        battleLogEl.scrollTop = battleLogEl.scrollHeight;
      }

      function clearLog() {
        battleLogEl.innerHTML = '';
      }

      function parseInputToTechs() {
        return stackInput.value
          .split(',')
          .map((part) => part.trim())
          .filter(Boolean);
      }

      function addTechs() {
        const techs = parseInputToTechs();
        if (!techs.length) {
          appendLog('System: Enter at least one technology.');
          return;
        }

        techs.forEach((tech) => {
          playerStack.push(getStatsForTech(tech));
          appendLog(`Joined team: ${titleCase(tech)}`);
        });

        stackInput.value = '';
        renderStacks();
      }

      function randomUniqueTechs(count) {
        const pool = [...enemyTechPool];
        const picks = [];

        while (picks.length < count && pool.length > 0) {
          const idx = Math.floor(Math.random() * pool.length);
          picks.push(pool.splice(idx, 1)[0]);
        }

        return picks;
      }

      function generateEnemyStack(size) {
        return randomUniqueTechs(size).map((tech) => getStatsForTech(tech));
      }

      function nextAlive(stack) {
        return stack.find((fighter) => fighter.hp > 0);
      }

      function calculateDamage(attacker, defender) {
        const base = attacker.atk - Math.floor(defender.def * DEFENSE_MITIGATION);
        const variance = Math.floor(Math.random() * DAMAGE_VARIANCE);
        return Math.max(MIN_DAMAGE, base + variance);
      }

      function takeTurn(attacker, defender, sideLabel) {
        if (!attacker || !defender) return;

        const damage = calculateDamage(attacker, defender);
        defender.hp = Math.max(0, defender.hp - damage);

        appendLog(
          `${sideLabel} ${attacker.name} hits ${defender.name} for ${damage}. (${defender.hp}/${defender.maxHp} HP)`
        );

        if (defender.hp === 0) {
          appendLog(`${defender.name} has been knocked out!`);
        }
      }

      function battle() {
        if (!playerStack.length) {
          appendLog('System: Add your stack before starting battle.');
          return;
        }

        clearLog();

        const playerTeam = playerStack.map((fighter) => ({
          ...fighter,
          hp: fighter.maxHp
        }));
        const enemyTeam = generateEnemyStack(Math.max(1, playerTeam.length));

        appendLog('=== ENCOUNTER START ===');
        appendLog(`Enemy squad formed: ${enemyTeam.map((f) => f.name).join(', ')}`);

        let turn = 1;
        while (turn <= MAX_TURNS) {
          const ally = nextAlive(playerTeam);
          const foe = nextAlive(enemyTeam);
          if (!ally || !foe) break;

          appendLog(`-- Turn ${turn} --`);

          const allyFirst = ally.spd >= foe.spd;
          if (allyFirst) {
            takeTurn(ally, foe, 'Your');
            if (foe.hp > 0) takeTurn(foe, ally, 'Enemy');
          } else {
            takeTurn(foe, ally, 'Enemy');
            if (ally.hp > 0) takeTurn(ally, foe, 'Your');
          }

          turn++;
        }

        const playerAlive = nextAlive(playerTeam);
        const enemyAlive = nextAlive(enemyTeam);
        const timedOut = turn > MAX_TURNS;

        if (playerAlive && !enemyAlive) {
          appendLog('🏆 Victory! Your tech stack dominates the battlefield.');
        } else if (!playerAlive && enemyAlive) {
          appendLog('💀 Defeat! Enemy stack overpowers your team.');
        } else if (timedOut && playerAlive && enemyAlive) {
          appendLog('⚖️ Draw! Battle reached the turn limit.');
        } else {
          appendLog('⚖️ Draw! Both teams are down.');
        }

        appendLog('=== ENCOUNTER END ===');

        playerStack = playerTeam;
        renderStacks(enemyTeam);
      }

      addStackBtn.addEventListener('click', addTechs);
      battleBtn.addEventListener('click', battle);
      stackInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          addTechs();
        }
      });

      renderStacks();
    </script>
  </body>
</html>
